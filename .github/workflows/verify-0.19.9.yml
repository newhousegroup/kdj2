name: Verify 0.19.9

on:
  push:
    branches:
      - main

jobs:
  verify-0199:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/game-0.19.9.js
      - run: node --check src/patch-0.19.9.js
      - run: node --check src/network-0.19.9.js
      - run: grep -F 'src/network-0.19.9.js?v=0.19.9' index.html
      - run: grep -F 'src/game-0.19.9.js?v=0.19.9' index.html
      - run: grep -F 'window.KDJ_VERSION = "0.19.9";' version.js
      - run: grep -F 'backwards < -0.025' src/patch-0.19.9.js
      - run: grep -F 'setTimeout(update, 1200);' src/network-0.19.9.js
      - name: Verify 0.19.9 gameplay patch against stable chain
        run: node scripts/verify-loader.mjs src/game-0.9.3.js src/patch-0.10.0.js src/patch-0.11.0.js src/patch-0.11.1.js src/patch-0.11.2.js src/patch-0.11.3.js src/patch-0.12.0.js src/patch-0.12.1.js src/patch-0.14.3.js src/patch-2.0.0-beta1.js src/patch-2.0.0-beta2.js src/patch-2.0.0-beta3.js src/patch-2.0.0-beta4.js src/patch-0.17.0.js src/patch-0.17.1.js src/patch-0.17.3.js src/patch-0.17.4.js src/patch-0.17.5.js src/patch-0.17.6.js src/patch-0.18.0.js src/patch-0.18.1.js src/patch-0.18.3.js src/patch-0.19.0.js src/patch-0.19.1.js src/patch-0.19.2.js src/patch-0.19.4.js src/patch-0.19.5.js src/patch-0.19.8.js src/patch-0.19.9.js
