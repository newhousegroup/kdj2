name: Verify 0.20.6

on:
  push:
    branches:
      - main

jobs:
  verify-0206:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/patch-0.20.6.js
      - run: node --check src/game-0.20.6.js
      - run: grep -F 'window.KDJ_VERSION = "0.20.6";' version.js
      - run: grep -F 'src/game-0.20.6.js?v=0.20.6-hotfix1' index.html
      - name: Verify 0.20.6 patch applies to real 0.20.2 source shapes
        run: |
          node --input-type=module <<'NODE'
          import { patchGameSource } from './src/patch-0.20.6.js';

          const inputBlock = `    // Desktop keyboard steering/strafe correction: testers reported A/D mirrored.
              // Swap keyboard A/D only; keep touch joystick left/right semantics unchanged.
              a: keys.d || touch.x < -0.18,
              d: keys.a || touch.x > 0.18,`;
          const badVector = `  const dx = strafe * Math.cos(yaw) - forward * Math.sin(yaw);
            const dz = strafe * Math.sin(yaw) - forward * Math.cos(yaw);`;
          const scoreFirst = `  if ((state.round || 1) > 1) ui.objective.textContent = \`British \${Number(state.score?.british || 0)} - \${Number(state.score?.french || 0)} French\`;
            else if (p.role === "captain") ui.objective.textContent = \`Captain of \${TEAM[p.ship].ship} · WASD to steer · E to leave helm\`;`;
          const mission = `  else ui.objective.textContent = \`Protect \${TEAM[p.team].ship} · capture the enemy flag or destroy their ship.\`;`;

          const source = [inputBlock, badVector, badVector, scoreFirst, mission].join('\n');
          const out = patchGameSource(source);

          if (!out.includes('a: keys.a || touch.x < -0.18')) throw new Error('keyboard left mapping not fixed');
          if (!out.includes('d: keys.d || touch.x > 0.18')) throw new Error('keyboard right mapping not fixed');
          const fixedVector = `  const dx = strafe * Math.cos(yaw) - forward * Math.sin(yaw);
            const dz = -strafe * Math.sin(yaw) - forward * Math.cos(yaw);`;
          if (out.split(fixedVector).length - 1 !== 2) throw new Error('authoritative/prediction strafe vectors not both fixed');
          if (out.includes('if ((state.round || 1) > 1) ui.objective.textContent')) throw new Error('scoreboard still overrides contextual objectives');
          if (!out.includes('else ui.objective.textContent = (state.round || 1) > 1')) throw new Error('scoreboard fallback missing');
          console.log('0.20.6 patch transforms successfully');
          NODE
