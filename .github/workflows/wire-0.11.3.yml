name: Wire 0.11.3 release

on:
  push:
    branches:
      - release-0.11.3

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.11.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wire-0.11.3.mjs
      - name: Commit wired release
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.js README.md
          git commit -m "Wire KDJs 0.11.3 release"
          git push origin HEAD:release-0.11.3
