name: Verify game build

on:
  push:
    branches:
      - main
      - release-0.11.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/game-0.11.1.js
      - run: node --check src/patch-0.10.0.js
      - run: node --check src/patch-0.11.0.js
      - run: node --check src/patch-0.11.1.js
      - run: node scripts/verify-loader.mjs src/game-0.9.3.js src/patch-0.10.0.js src/patch-0.11.0.js src/patch-0.11.1.js
