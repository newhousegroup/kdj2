name: Verify game build

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/game-0.19.8.js
      - run: node --check src/game-0.19.7.js
      - run: node --check src/game-0.19.6.js
      - run: node --check src/game-0.19.5.js
      - run: node --check src/game-0.19.4.js
      - run: node --check src/game-0.19.3.js
      - run: node --check src/game-0.19.2.js
      - run: node --check src/game-0.19.1.js
      - run: node --check src/game-0.19.0.js
      - run: node --check src/game-0.18.11.js
      - run: node --check src/game-0.18.10.js
      - run: node --check src/game-0.18.9.js
      - run: node --check src/game-0.18.8.js
      - run: node --check src/game-0.18.6.js
      - run: node --check src/game-0.18.5.js
      - run: node --check src/game-0.18.4.js
      - run: node --check src/game-0.18.3.js
      - run: node --check src/game-0.18.2.js
      - run: node --check src/game-0.18.1.js
      - run: node --check src/game-0.18.0.js
      - run: node --check src/game-0.17.6.js
      - run: node --check src/game-0.17.5.js
      - run: node --check src/game-0.17.4.js
      - run: node --check src/game-0.17.3.js
      - run: node --check src/game-0.17.1.js
      - run: node --check src/game-0.12.1.js
      - run: node --check src/patch-0.10.0.js
      - run: node --check src/patch-0.11.0.js
      - run: node --check src/patch-0.11.1.js
      - run: node --check src/patch-0.11.2.js
      - run: node --check src/patch-0.11.3.js
      - run: node --check src/patch-0.12.0.js
      - run: node --check src/patch-0.12.1.js
      - run: node --check src/patch-0.14.3.js
      - run: node --check src/patch-2.0.0-beta1.js
      - run: node --check src/patch-2.0.0-beta2.js
      - run: node --check src/patch-2.0.0-beta3.js
      - run: node --check src/patch-2.0.0-beta4.js
      - run: node --check src/patch-0.17.0.js
      - run: node --check src/patch-0.17.1.js
      - run: node --check src/patch-0.17.3.js
      - run: node --check src/patch-0.17.4.js
      - run: node --check src/patch-0.17.5.js
      - run: node --check src/patch-0.17.6.js
      - run: node --check src/patch-0.18.0.js
      - run: node --check src/patch-0.18.1.js
      - run: node --check src/patch-0.18.3.js
      - run: node --check src/patch-0.18.9.js
      - run: node --check src/patch-0.19.0.js
      - run: node --check src/patch-0.19.1.js
      - run: node --check src/patch-0.19.2.js
      - run: node --check src/patch-0.19.3.js
      - run: node --check src/patch-0.19.4.js
      - run: node --check src/patch-0.19.5.js
      - run: node --check src/patch-0.19.6.js
      - run: node --check src/patch-0.19.8.js
      - run: grep -F 'finalSource = patch0198(finalSource);' src/game-0.19.8.js
      - run: grep -F 'const broadsideSign = cannon.side === -1 ? -1 : 1;' src/patch-0.19.8.js
      - name: Ensure broken 0.19.6 patch is not in 0.19.8
        run: >-
          if grep -F 'patch-0.19.6.js' src/game-0.19.8.js; then echo '0.19.6 patch leaked into 0.19.8'; exit 1; fi
      - name: Ensure 0.19.3 hull patch is still absent
        run: >-
          if grep -F 'patch-0.19.3.js' src/game-0.19.8.js; then echo '0.19.3 hull patch leaked into 0.19.8'; exit 1; fi
      - name: Verify broadside-relative cannon controls
        run: >-
          node -e 'const turn=(side,left,right)=>((right?1:0)-(left?1:0))*(side===-1?-1:1); if(turn(1,false,true)!==1)throw new Error("starboard D changed"); if(turn(1,true,false)!==-1)throw new Error("starboard A changed"); if(turn(-1,false,true)!==-1)throw new Error("port D not mirrored"); if(turn(-1,true,false)!==1)throw new Error("port A not mirrored"); console.log("broadside cannon controls OK");'
      - name: Verify Reefed can accelerate from rest at high FPS
        run: >-
          node -e 'let speed=0; const dt=1/120, sailPower=0.50, mobility=1, speedControl=1; for(let i=0;i<120;i++){const maxForward=6.03*sailPower*mobility;if(speedControl>0&&speed<maxForward)speed=Math.min(maxForward,speed+1.72*sailPower*mobility*dt);const drag=0.06;if(Math.abs(speed)>0)speed-=Math.sign(speed)*Math.min(Math.abs(speed),drag*dt);if(!speedControl&&Math.abs(speed)<0.025)speed=0;} if(!(speed>0.5))throw new Error(`Reefed failed: ${speed}`); console.log(`Reefed OK: ${speed.toFixed(3)}`);'
      - name: Verify 0.19.8 materializes from stable 0.19.5 chain
        run: node scripts/verify-loader.mjs src/game-0.9.3.js src/patch-0.10.0.js src/patch-0.11.0.js src/patch-0.11.1.js src/patch-0.11.2.js src/patch-0.11.3.js src/patch-0.12.0.js src/patch-0.12.1.js src/patch-0.14.3.js src/patch-2.0.0-beta1.js src/patch-2.0.0-beta2.js src/patch-2.0.0-beta3.js src/patch-2.0.0-beta4.js src/patch-0.17.0.js src/patch-0.17.1.js src/patch-0.17.3.js src/patch-0.17.4.js src/patch-0.17.5.js src/patch-0.17.6.js src/patch-0.18.0.js src/patch-0.18.1.js src/patch-0.18.3.js src/patch-0.19.0.js src/patch-0.19.1.js src/patch-0.19.2.js src/patch-0.19.4.js src/patch-0.19.5.js src/patch-0.19.8.js
