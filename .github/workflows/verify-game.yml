name: Verify game build

on:
  push:
    branches:
      - main
      - fix-0.9.2
      - fix-0.9.3

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-loader.mjs
      - run: node scripts/verify-loader.mjs src/game-0.9.3.js
